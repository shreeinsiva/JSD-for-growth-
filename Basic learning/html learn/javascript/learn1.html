<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        function display(){
            var n1=parseInt(document.getElementById("t1").value);
            var n2=parseInt(document.getElementById("t2").value);
            var res="";
            for(var i=n1;i<=n2;i++){
                res=res+i+"";
            }
           document.getElementById("ans").innerHTML=res;
        }

        function show(){
            var s=parseInt(document.getElementById("u1").value);
            var arr=new Array(s);
            for(var k=0;k<s;k++){
                arr[k]=prompt("enter array value at index:"+k);
            }
            for(var j=0;j<s;j++){
                document.write(" "+arr[j]);
            }
        }
    </script>
</head>
<body>
    <h1><center>For loop</center></h1>
    <input type="text" id="t1" placeholder="Enter Start Number"><br>
    <input type="text" id="t2" placeholder="Enter end Number"><br>
    <input type="button" value="show answer" onclick="display()">
    <div id="ans"></div>
    <br>
        <h1><center>Array</center></h1>
        <input type="text" id="u1" placeholder="Enter Array Size"><br>
        <input type="button" value="list of array" onclick="show()">




</body>
</html>
